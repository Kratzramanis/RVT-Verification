name: Execute RVT Matrix Processing

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-python-matrix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib pillow imageio ipython scipy

    - name: Run RVT Script
      run: |
        python "3dto2d(1).py"

    - name: Commit and Push Generated GIFs
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add *.gif || true
        git commit -m "Update dynamic RVT animation frames (10 FPS)" || echo "No changes to commit"
        git push
